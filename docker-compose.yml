name: distributedjobscheduler

services:

  db:
    image: postgres:16
    restart: unless-stopped

    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler_password
      POSTGRES_DB: scheduler_db

    ports:
      - "5432:5432"

    volumes:
      - scheduler_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U scheduler -d scheduler_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: distributedjobscheduler-api:latest

    command:
      - sh
      - -c
      - "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

    depends_on:
      db:
        condition: service_healthy

    environment:
      API_KEY: ${API_KEY}
      DATABASE_URL: postgresql+psycopg://scheduler:scheduler_password@db:5432/scheduler_db

      WORKER_IMAGE: distributedjobscheduler-worker:latest
      WORKER_NETWORK: distributedjobscheduler_default

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    ports:
      - "8000:8000"

    restart: unless-stopped


  worker:
    build:
      context: .
      dockerfile: Dockerfile

    image: distributedjobscheduler-worker:latest

    command:
      - python
      - worker.py

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql+psycopg://scheduler:scheduler_password@db:5432/scheduler_db

      # Container-per-job sandboxing. Set to "subprocess" to run job
      # commands directly on the worker's own OS instead (faster,
      # but no isolation beyond the resource caps below) -- see the
      # README's "Security notes" section for the trade-off.
      SANDBOX_MODE: docker
      JOB_RUNNER_IMAGE: python:3.12-slim
      JOB_NETWORK_DISABLED: "true"

    volumes:
      # Lets this worker spin up sibling containers for sandboxed
      # job execution (SANDBOX_MODE=docker). Same pattern the api
      # service already uses for dynamic worker scaling.
      - /var/run/docker.sock:/var/run/docker.sock

    labels:
      scheduler.managed: "true"
      scheduler.component: "worker"

    restart: unless-stopped


volumes:
  scheduler_postgres_data: