name: distributedjobscheduler

services:

  db:
    image: postgres:16
    restart: unless-stopped

    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler_password
      POSTGRES_DB: scheduler_db

    ports:
      - "5432:5432"

    volumes:
      - scheduler_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U scheduler -d scheduler_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: distributedjobscheduler-api:latest

    command:
      - sh
      - -c
      - "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

    depends_on:
      db:
        condition: service_healthy

    environment:
      API_KEY: ${API_KEY}
      DATABASE_URL: postgresql+psycopg://scheduler:scheduler_password@db:5432/scheduler_db

      WORKER_IMAGE: distributedjobscheduler-worker:latest
      WORKER_NETWORK: distributedjobscheduler_default

      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    ports:
      - "8000:8000"

    restart: unless-stopped


  worker:
    build:
      context: .
      dockerfile: Dockerfile

    image: distributedjobscheduler-worker:latest

    command:
      - python
      - worker.py

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql+psycopg://scheduler:scheduler_password@db:5432/scheduler_db

      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JOB_MAX_MEMORY_MB: ${JOB_MAX_MEMORY_MB:-512}
      JOB_MAX_CPU_SECONDS: ${JOB_MAX_CPU_SECONDS:-280}
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-300}

      SANDBOX_MODE: ${SANDBOX_MODE:-docker}
      JOB_RUNNER_IMAGE: ${JOB_RUNNER_IMAGE:-python:3.12-slim}
      JOB_NETWORK_DISABLED: ${JOB_NETWORK_DISABLED:-true}

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    labels:
      scheduler.managed: "true"
      scheduler.component: "worker"

    restart: unless-stopped


volumes:
  scheduler_postgres_data:
